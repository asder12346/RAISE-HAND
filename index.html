    <script>
      // Compatibility shim for browser extension request interceptors
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(fn) {
              originalFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Property already locked or non-configurable
        }

        // Ignore unhandled errors injected by third-party browser extensions
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (
              event.filename.indexOf('chrome-extension://') !== -1 ||
              event.filename.indexOf('moz-extension://') !== -1 ||
              event.filename.indexOf('safari-extension://') !== -1
            )) ||
            (event.error && event.error.stack && event.error.stack.indexOf('chrome-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

  </body>
